<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Johnrick Auto Supply</title>
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <span><span style="color:#ff0000;">JOHNRICK</span> AUTO SUPPLY</span>
      </a>
    </div>
  </nav>

  <div class="container my-5 text-center">
    <i class="fa fa-check-circle fa-5x text-success mb-4"></i>
    <h2>Payment Successful!</h2>
    <p class="text-muted">Thank you for your purchase via GCash.</p>
    <p id="orderIdDisplay" class="fw-bold"></p>
    <a href="index.html" class="btn btn-danger mt-3">Continue Shopping</a>
    <a href="profile.html#orders" class="btn btn-outline-danger mt-3 ms-2">View My Orders</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
      document.getElementById('orderIdDisplay').textContent = `Order #${orderId}`;

      // Update order status to Processing since payment is confirmed
      fetch(`https://johnrick-auto-backend-production-c37a.up.railway.app/api/orders/${orderId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'Processing' })
      }).catch(err => console.error('Error updating order status:', err));
    }
  </script>
</body>
</html>
