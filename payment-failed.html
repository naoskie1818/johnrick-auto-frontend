<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed - Johnrick Auto Supply</title>
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <span><span style="color:#ff0000;">JOHNRICK</span> AUTO SUPPLY</span>
      </a>
    </div>
  </nav>

  <div class="container my-5 text-center">
    <i class="fa fa-times-circle fa-5x text-danger mb-4"></i>
    <h2>Payment Cancelled or Failed</h2>
    <p class="text-muted">Your GCash payment was not completed.</p>
    <p id="orderIdDisplay" class="fw-bold"></p>
    <a href="cart.html" class="btn btn-danger mt-3">Try Again</a>
    <a href="index.html" class="btn btn-outline-danger mt-3 ms-2">Back to Home</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
      document.getElementById('orderIdDisplay').textContent = `Order #${orderId}`;
    }
  </script>
</body>
</html>
